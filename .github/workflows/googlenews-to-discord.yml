name: Google News to Discord

on:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: google-news-to-discord
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Prepare state directory
        run: |
          mkdir -p .google-news-state
          touch .google-news-state/state-placeholder.txt

      - name: Find latest completed state artifact
        id: previous_state
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const workflowIds = [
              'googlenews-to-discord.yml',
              'googlenews-manual-test.yml',
            ];
            const runs = [];
            for (const workflowId of workflowIds) {
              const { data: runPage } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                status: 'completed',
                per_page: 100,
              });
              runs.push(...runPage.workflow_runs);
            }
            runs.sort(
              (left, right) => new Date(right.created_at) - new Date(left.created_at)
            );
            let artifactId = '';
            let sourceRunId = '';
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const { data: artifactPage } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifacts = artifactPage.artifacts;
              const state = artifacts.find(
                artifact => artifact.name === 'google-news-state' && !artifact.expired
              );
              if (state) {
                artifactId = String(state.id);
                sourceRunId = String(run.id);
                break;
              }
            }
            core.setOutput('artifact-id', artifactId);
            core.setOutput('source-run-id', sourceRunId);

      - name: Restore previous state
        if: steps.previous_state.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.previous_state.outputs.artifact-id }}
          path: .google-news-state
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.source-run-id }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements.txt
          python -m pip check

      - name: Run unified Google News dispatcher
        env:
          GOOGLE_NEWS_DELIVERY_ORDER: ${{ vars.GOOGLE_NEWS_DELIVERY_ORDER || 'feed_oldest_first' }}
          FEED_DATE_FILTER: ${{ vars.FEED_DATE_FILTER }}
          FEED_KEYWORD_FILTER: ${{ vars.FEED_KEYWORD_FILTER }}
          FEED_KEYWORD_SCOPE: ${{ vars.FEED_KEYWORD_SCOPE || 'title' }}
          FEED_TIMEZONE: ${{ vars.FEED_TIMEZONE }}
          FEED_COUNTRY: ${{ vars.FEED_COUNTRY }}
          DISPLAY_LANGUAGE: ${{ vars.DISPLAY_LANGUAGE }}
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
          DISCORD_WEBHOOK_GN_TOP_US: ${{ secrets.DISCORD_WEBHOOK_GN_TOP_US }}
          DISCORD_WEBHOOK_GN_TOP_KR: ${{ secrets.DISCORD_WEBHOOK_GN_TOP_KR }}
          DISCORD_WEBHOOK_GN_TOP_JP: ${{ secrets.DISCORD_WEBHOOK_GN_TOP_JP }}
          DISCORD_WEBHOOK_GN_TOP_CN: ${{ secrets.DISCORD_WEBHOOK_GN_TOP_CN }}
          DISCORD_WEBHOOK_GN_TOPIC_KOREA: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_KOREA }}
          DISCORD_WEBHOOK_GN_TOPIC_SEOUL: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_SEOUL }}
          DISCORD_WEBHOOK_GN_TOPIC_ENT: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_ENT }}
          DISCORD_WEBHOOK_GN_TOPIC_TECH: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_TECH }}
          DISCORD_WEBHOOK_GN_TOPIC_SCITECH: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_SCITECH }}
          DISCORD_WEBHOOK_GN_KEYWORD_NOCODE: ${{ secrets.DISCORD_WEBHOOK_GN_KEYWORD_NOCODE }}
          DISCORD_WEBHOOK_GN_KEYWORD_IU: ${{ secrets.DISCORD_WEBHOOK_GN_KEYWORD_IU }}
        run: python .github/scripts/google_news_dispatcher.py --state-dir .google-news-state

      - name: Write safe run summary
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = '.google-news-state/run-summary.json';
            if (!fs.existsSync(path)) {
              await core.summary.addHeading('Google News').addRaw('No run summary was produced.').write();
              return;
            }
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const pending = summary.profiles.reduce((total, item) => total + item.pending_count, 0);
            const ambiguous = summary.profiles.reduce((total, item) => total + item.ambiguous_retry_count, 0);
            await core.summary
              .addHeading('Google News')
              .addRaw(`Status: ${summary.status}\n`)
              .addRaw(`Profiles: ${summary.profiles.length}\n`)
              .addRaw(`Pending deliveries: ${pending}\n`)
              .addRaw(`Ambiguous retries: ${ambiguous}\n`)
              .write();

      - name: Upload updated state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-news-state
          path: .google-news-state/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
