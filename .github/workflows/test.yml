name: Python Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: pip install -r .github/requirements.txt

      - name: Run Unit Tests
        run: python -m unittest discover -s .github/tests -v

      - name: Compile Google News Scripts
        run: >-
          python -m py_compile
          .github/scripts/google_news_url_resolver.py
          .github/scripts/googlenews-*_to_discord.py
