name: Python Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            .github/requirements.txt
            .github/requirements-youtube.txt
            .github/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements.txt
          python -m pip install --require-hashes -r .github/requirements-youtube.txt
          python -m pip install --require-hashes -r .github/requirements-dev.txt
          python -m pip check

      - name: Run Unit Tests
        run: |
          python -m coverage run --source=.github/scripts -m unittest discover -s .github/tests -v
          python -m coverage report

      - name: Validate Google News profile configuration
        run: >-
          python .github/scripts/google_news_dispatcher.py
          --check-config
          --state-dir "$(mktemp -d)"

      - name: Compile Every Script
        run: python -m compileall -q .github/scripts

      - name: Lint Python
        run: ruff check .github/scripts .github/tests

      - name: Lint Workflows
        run: yamllint -c .yamllint .github/workflows

      - name: Test the External Trigger
        run: node --test ops/state-trigger/test/*.test.mjs

      - name: Validate JSON configuration
        run: |
          python -m json.tool .github/config/google_news_profiles.json > /dev/null
          python -m json.tool .github/config/google_news_publishers.json > /dev/null
