name: Python Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-youtube.txt

      - name: Install Dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-youtube.txt
          python -m pip check

      - name: Run Unit Tests
        run: python -m unittest discover -s .github/tests -v

      - name: Compile Google News Scripts
        run: >-
          python -m py_compile
          .github/scripts/feed_filters.py
          .github/scripts/feed_localization.py
          .github/scripts/delivery_admin_alert.py
          .github/scripts/google_news_delivery_state.py
          .github/scripts/google_news_discord_delivery.py
          .github/scripts/google_news_dispatcher.py
          .github/scripts/google_news_feed_filter.py
          .github/scripts/google_news_keyword_matcher.py
          .github/scripts/google_news_manual_test.py
          .github/scripts/google_news_profile_result.py
          .github/scripts/google_news_profiles.py
          .github/scripts/google_news_related_links.py
          .github/scripts/google_news_request_guard.py
          .github/scripts/google_news_url_resolver.py
          .github/scripts/googlenews-*_to_discord.py

      - name: Compile YouTube Scripts
        run: >-
          python -m py_compile
          .github/scripts/youtube_delivery_state.py
          .github/scripts/youtube_discord_delivery.py
          .github/scripts/youtube_messages.py
          .github/scripts/youtube_video_source.py
          .github/scripts/youtube_to_discord.py
