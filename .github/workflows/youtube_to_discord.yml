name: YouTube to Discord Notification

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: youtube-to-discord
  cancel-in-progress: false

env:
  INITIALIZE_MODE_YOUTUBE: ${{ secrets.INITIALIZE_MODE_YOUTUBE }}

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Find latest completed database artifact
        id: previous_state
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const workflowIds = [
              'youtube_to_discord.yml',
              'youtube-manual-test.yml',
            ];
            const runs = [];
            for (const workflowId of workflowIds) {
              const { data: runPage } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                status: 'completed',
                per_page: 100,
              });
              runs.push(...runPage.workflow_runs);
            }
            runs.sort(
              (left, right) => new Date(right.created_at) - new Date(left.created_at)
            );
            let artifactId = '';
            let sourceRunId = '';
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const { data: artifactPage } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifactPage.artifacts.find(
                artifact => artifact.name === 'youtube_database' && !artifact.expired
              );
              if (artifact) {
                artifactId = String(artifact.id);
                sourceRunId = String(run.id);
                break;
              }
            }
            core.setOutput('artifact-id', artifactId);
            core.setOutput('source-run-id', sourceRunId);

      - name: Restore previous database
        id: restore_state
        if: env.INITIALIZE_MODE_YOUTUBE != 'true' && steps.previous_state.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.previous_state.outputs.artifact-id }}
          path: .
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.source-run-id }}

      - name: Retry restore previous database
        id: retry_restore
        if: steps.restore_state.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.previous_state.outputs.artifact-id }}
          path: .
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.source-run-id }}

      - name: Fail when state restore failed
        if: always() && env.INITIALIZE_MODE_YOUTUBE != 'true' && steps.previous_state.outcome == 'success' && steps.previous_state.outputs.artifact-id != '' && steps.restore_state.outcome != 'success' && steps.retry_restore.outcome != 'success'
        run: |
          echo "::error title=YouTube state restore failed::Keeping the previous artifact and skipping the database upload."
          exit 1

      - name: Inspect restored database
        id: state
        shell: bash
        run: |
          if [[ "$INITIALIZE_MODE_YOUTUBE" != "true" && -f youtube_videos.db ]]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-youtube.txt

      - name: Install Dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-youtube.txt
          python -m pip check

      - name: Notify Discord of New YouTube Videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_SOURCE: ${{ vars.YOUTUBE_SOURCE || 'api' }}
          YOUTUBE_MODE: ${{ secrets.YOUTUBE_MODE }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
          YOUTUBE_SEARCH_KEYWORD: ${{ secrets.YOUTUBE_SEARCH_KEYWORD }}
          YOUTUBE_PLAYLIST_LAYOUT: ${{ vars.YOUTUBE_PLAYLIST_LAYOUT || 'auto' }}
          YOUTUBE_REGION_CODE: ${{ vars.YOUTUBE_REGION_CODE }}
          YOUTUBE_SERVICE_TIMEZONE: ${{ vars.YOUTUBE_SERVICE_TIMEZONE }}
          YOUTUBE_DELIVERY_ORDER: ${{ vars.YOUTUBE_DELIVERY_ORDER || 'feed_oldest_first' }}
          YOUTUBE_RUN_SUMMARY_PATH: youtube-run-summary.json
          INITIALIZE_MODE_YOUTUBE: ${{ env.INITIALIZE_MODE_YOUTUBE }}
          YOUTUBE_BASELINE_ONLY: ${{ steps.state.outputs.restored != 'true' }}
          YOUTUBE_MANUAL_TEST_MODE: 'false'
          ADVANCED_FILTER_YOUTUBE: ${{ secrets.ADVANCED_FILTER_YOUTUBE }}
          DATE_FILTER_YOUTUBE: ${{ secrets.DATE_FILTER_YOUTUBE }}
          LANGUAGE_YOUTUBE: ${{ secrets.LANGUAGE_YOUTUBE }}
          FEED_DATE_FILTER: ${{ vars.FEED_DATE_FILTER }}
          FEED_KEYWORD_FILTER: ${{ vars.FEED_KEYWORD_FILTER }}
          FEED_KEYWORD_SCOPE: ${{ vars.FEED_KEYWORD_SCOPE || 'title' }}
          FEED_TIMEZONE: ${{ vars.FEED_TIMEZONE }}
          FEED_COUNTRY: ${{ vars.FEED_COUNTRY }}
          DISPLAY_LANGUAGE: ${{ vars.DISPLAY_LANGUAGE || 'en' }}
          DISCORD_WEBHOOK_YOUTUBE: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE }}
          DISCORD_WEBHOOK_YOUTUBE_DETAILVIEW: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_DETAILVIEW }}
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
          YOUTUBE_DETAILVIEW: ${{ secrets.YOUTUBE_DETAILVIEW }}
        run: python .github/scripts/youtube_to_discord.py

      - name: Write safe run summary
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'youtube-run-summary.json';
            if (!fs.existsSync(path)) {
              await core.summary.addHeading('YouTube').addRaw('No run summary was produced.').write();
              return;
            }
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const summaryRunId = summary.run_id ? String(summary.run_id) : '';
            if (summaryRunId && summaryRunId !== String(context.runId)) {
              await core.summary
                .addHeading('YouTube')
                .addRaw('No run summary was produced for this run.')
                .write();
              return;
            }
            await core.summary
              .addHeading('YouTube')
              .addRaw(`Status: ${summary.status}\n`)
              .addRaw(`Pending deliveries: ${summary.pending_count}\n`)
              .addRaw(`Ambiguous retries: ${summary.ambiguous_retry_count}\n`)
              .write();

      - name: Upload updated database
        id: upload_state
        if: always() && steps.previous_state.outcome == 'success' && (env.INITIALIZE_MODE_YOUTUBE == 'true' || steps.previous_state.outputs.artifact-id == '' || steps.restore_state.outcome == 'success' || steps.retry_restore.outcome == 'success')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: youtube_database
          path: |
            youtube_videos.db
            youtube-run-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Retry database upload
        id: retry_state
        if: always() && steps.upload_state.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: youtube_database
          path: |
            youtube_videos.db
            youtube-run-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Note recovered database upload
        if: always() && steps.upload_state.outcome == 'failure' && steps.retry_state.outcome == 'success'
        run: echo "::warning title=YouTube database upload retried::The first upload failed and the retry succeeded"

      - name: Fail when database upload failed
        if: always() && steps.upload_state.outcome == 'failure' && steps.retry_state.outcome == 'failure'
        run: |
          echo "::error title=YouTube database upload failed::The next run may restore an older database and resend videos."
          exit 1

      - name: Notify admin of failed run
        if: failure()
        uses: actions/github-script@v9
        env:
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
        with:
          script: |
            const webhook = (process.env.DISCORD_WEBHOOK_ADMIN || '').trim();
            if (!webhook) return;
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'youtube_to_discord.yml',
              branch: 'main',
              status: 'completed',
              per_page: 5,
            });
            const previous = (data.workflow_runs || []).find(
              run => run.id !== context.runId
            );
            if (
              previous &&
              previous.conclusion === 'failure' &&
              Date.now() - new Date(previous.created_at).getTime() < 60 * 60 * 1000
            ) {
              core.info(
                'Skipping duplicate admin alert: the previous run also failed within 60 minutes.'
              );
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const content = ['**YouTube 실행 실패**', runUrl].join('\n');
            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                content,
                username: 'Discord Actions',
                allowed_mentions: { parse: [] },
              }),
            });
            if (!response.ok) {
              core.warning(`Admin notification failed with HTTP ${response.status}`);
            }
