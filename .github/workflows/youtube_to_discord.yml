name: YouTube to Discord Notification

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      manual_test:
        description: '최신 영상 1개만 전송하고 나머지는 기준선으로 저장'
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: youtube-to-discord
  cancel-in-progress: false

env:
  INITIALIZE_MODE_YOUTUBE: ${{ secrets.INITIALIZE_MODE_YOUTUBE }}

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Find latest completed database artifact
        id: previous_state
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const { data: runPage } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'youtube_to_discord.yml',
              status: 'completed',
              per_page: 100,
            });
            let artifactId = '';
            let sourceRunId = '';
            for (const run of runPage.workflow_runs) {
              if (run.id === context.runId) continue;
              const { data: artifactPage } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifactPage.artifacts.find(
                artifact => artifact.name === 'youtube_database' && !artifact.expired
              );
              if (artifact) {
                artifactId = String(artifact.id);
                sourceRunId = String(run.id);
                break;
              }
            }
            core.setOutput('artifact-id', artifactId);
            core.setOutput('source-run-id', sourceRunId);

      - name: Restore previous database
        if: env.INITIALIZE_MODE_YOUTUBE != 'true' && steps.previous_state.outputs.artifact-id != ''
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.previous_state.outputs.artifact-id }}
          path: .
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.source-run-id }}

      - name: Inspect restored database
        id: state
        shell: bash
        run: |
          if [[ "$INITIALIZE_MODE_YOUTUBE" != "true" && -f youtube_videos.db ]]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: pip install --upgrade -r .github/requirements.txt google-api-python-client isodate

      - name: Notify Discord of New YouTube Videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_SOURCE: ${{ vars.YOUTUBE_SOURCE || 'api' }}
          YOUTUBE_MODE: ${{ secrets.YOUTUBE_MODE }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
          YOUTUBE_SEARCH_KEYWORD: ${{ secrets.YOUTUBE_SEARCH_KEYWORD }}
          YOUTUBE_PLAYLIST_LAYOUT: ${{ vars.YOUTUBE_PLAYLIST_LAYOUT || 'auto' }}
          YOUTUBE_REGION_CODE: ${{ vars.YOUTUBE_REGION_CODE }}
          YOUTUBE_SERVICE_TIMEZONE: ${{ vars.YOUTUBE_SERVICE_TIMEZONE }}
          YOUTUBE_DELIVERY_ORDER: ${{ vars.YOUTUBE_DELIVERY_ORDER || 'feed_oldest_first' }}
          YOUTUBE_RUN_SUMMARY_PATH: youtube-run-summary.json
          INITIALIZE_MODE_YOUTUBE: ${{ env.INITIALIZE_MODE_YOUTUBE }}
          YOUTUBE_BASELINE_ONLY: ${{ steps.state.outputs.restored != 'true' }}
          YOUTUBE_MANUAL_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_test == true }}
          ADVANCED_FILTER_YOUTUBE: ${{ secrets.ADVANCED_FILTER_YOUTUBE }}
          DATE_FILTER_YOUTUBE: ${{ secrets.DATE_FILTER_YOUTUBE }}
          LANGUAGE_YOUTUBE: ${{ secrets.LANGUAGE_YOUTUBE }}
          FEED_DATE_FILTER: ${{ vars.FEED_DATE_FILTER }}
          FEED_KEYWORD_FILTER: ${{ vars.FEED_KEYWORD_FILTER }}
          FEED_KEYWORD_SCOPE: ${{ vars.FEED_KEYWORD_SCOPE || 'title' }}
          FEED_TIMEZONE: ${{ vars.FEED_TIMEZONE }}
          FEED_COUNTRY: ${{ vars.FEED_COUNTRY }}
          DISPLAY_LANGUAGE: ${{ vars.DISPLAY_LANGUAGE || 'en' }}
          DISCORD_WEBHOOK_YOUTUBE: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE }}
          DISCORD_WEBHOOK_YOUTUBE_DETAILVIEW: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_DETAILVIEW }}
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
          YOUTUBE_DETAILVIEW: ${{ secrets.YOUTUBE_DETAILVIEW }}
        run: python .github/scripts/youtube_to_discord.py

      - name: Write safe run summary
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'youtube-run-summary.json';
            if (!fs.existsSync(path)) {
              await core.summary.addHeading('YouTube').addRaw('No run summary was produced.').write();
              return;
            }
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            await core.summary
              .addHeading('YouTube')
              .addRaw(`Status: ${summary.status}\n`)
              .addRaw(`Pending deliveries: ${summary.pending_count}\n`)
              .addRaw(`Ambiguous retries: ${summary.ambiguous_retry_count}\n`)
              .write();

      - name: Upload updated database
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: youtube_database
          path: |
            youtube_videos.db
            youtube-run-summary.json
          if-no-files-found: error
          retention-days: 90
