name: Discord Actions Schedule Health

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check scheduled deliveries
        uses: actions/github-script@v9
        env:
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
          MAX_AGE_HOURS: ${{ vars.GOOGLE_NEWS_HEALTH_MAX_AGE_HOURS || '6' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const threshold = Number(process.env.MAX_AGE_HOURS || '6');
            if (!Number.isFinite(threshold) || threshold <= 0) {
              core.setFailed(`Invalid GOOGLE_NEWS_HEALTH_MAX_AGE_HOURS: ${process.env.MAX_AGE_HOURS}`);
              return;
            }
            const workflows = [
              { id: 'googlenews-to-discord.yml', label: 'Google News' },
              { id: 'youtube_to_discord.yml', label: 'YouTube' },
            ];
            const problems = [];
            for (const workflow of workflows) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow.id,
                branch: 'main',
                status: 'completed',
                per_page: 5,
              });
              const runs = data.workflow_runs || [];
              const latest = runs[0];
              const latestSuccess = runs.find(run => run.conclusion === 'success');
              const ageHours = latest
                ? (Date.now() - new Date(latest.created_at).getTime()) / 3600000
                : Infinity;
              const successAgeHours = latestSuccess
                ? (Date.now() - new Date(latestSuccess.created_at).getTime()) / 3600000
                : Infinity;
              core.info(
                `${workflow.label}: latest=${latest ? latest.created_at : 'none'} (${ageHours.toFixed(1)}h), ` +
                  `success=${latestSuccess ? latestSuccess.created_at : 'none'} (${successAgeHours.toFixed(1)}h)`
              );
              if (ageHours >= threshold || successAgeHours >= threshold) {
                problems.push({ ...workflow, ageHours, successAgeHours, latest, latestSuccess });
              }
            }
            if (problems.length === 0) {
              core.info(`All deliveries have a successful run within ${threshold} hours.`);
              return;
            }
            const webhook = (process.env.DISCORD_WEBHOOK_ADMIN || '').trim();
            if (!webhook) {
              core.setFailed(
                `No successful delivery within ${threshold} hours and DISCORD_WEBHOOK_ADMIN is not configured.`
              );
              return;
            }
            const lines = [
              '**Discord Actions 예약 실행이 멈췄습니다**',
              `기준: ${threshold}시간`,
            ];
            for (const problem of problems) {
              const latestText = problem.latest
                ? `${problem.ageHours.toFixed(1)}시간 전`
                : '없음';
              const successText = problem.latestSuccess
                ? `${problem.successAgeHours.toFixed(1)}시간 전`
                : '없음';
              lines.push(
                `- ${problem.label}: 마지막 실행 ${latestText}, 마지막 성공 ${successText}`
              );
              if (problem.latest) {
                lines.push(`  ${problem.latest.html_url}`);
              }
            }
            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                content: lines.join('\n'),
                username: 'Discord Actions',
                allowed_mentions: { parse: [] },
              }),
            });
            if (!response.ok) {
              core.setFailed(`Admin notification failed with HTTP ${response.status}`);
            }
