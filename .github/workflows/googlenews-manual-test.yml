name: Google News Manual Delivery Test

run-name: Google News manual test — ${{ inputs.profile }}

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Select one profile (max 1 article) or all (up to 11 articles). / 프로필 1개(기사 최대 1건) 또는 all(최대 11건)을 선택합니다.'
        required: true
        default: top_kr
        type: choice
        options:
          - top_kr
          - all
          - top_us
          - top_jp
          - top_cn
          - topic_korea
          - topic_seoul
          - topic_ent
          - topic_tech
          - topic_scitech
          - keyword_nocode
          - keyword_iu

permissions:
  actions: read
  contents: read

concurrency:
  group: google-news-to-discord
  cancel-in-progress: false

jobs:
  deliver:
    name: Deliver real Discord test message / 실제 Discord 시험 메시지 전송
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Prepare state directory
        run: |
          mkdir -p .google-news-state
          touch .google-news-state/state-placeholder.txt

      - name: Find latest completed state artifact
        id: previous_state
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const workflowIds = [
              'googlenews-to-discord.yml',
              'googlenews-manual-test.yml',
              'googlenews-reset.yml',
            ];
            const runs = [];
            for (const workflowId of workflowIds) {
              const { data: runPage } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                status: 'completed',
                per_page: 100,
              });
              runs.push(...runPage.workflow_runs);
            }
            runs.sort(
              (left, right) => new Date(right.created_at) - new Date(left.created_at)
            );
            let artifactId = '';
            let sourceRunId = '';
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const { data: artifactPage } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const state = artifactPage.artifacts.find(
                artifact => artifact.name === 'google-news-state' && !artifact.expired
              );
              if (state) {
                artifactId = String(state.id);
                sourceRunId = String(run.id);
                break;
              }
            }
            core.setOutput('artifact-id', artifactId);
            core.setOutput('source-run-id', sourceRunId);

      - name: Restore previous state
        if: steps.previous_state.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.previous_state.outputs.artifact-id }}
          path: .google-news-state
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.source-run-id }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements.txt
          python -m pip check

      - name: Run selected Google News profile
        env:
          SELECTED_PROFILE: ${{ inputs.profile }}
          GOOGLE_NEWS_DELIVERY_ORDER: ${{ vars.GOOGLE_NEWS_DELIVERY_ORDER || 'feed_oldest_first' }}
          GOOGLE_NEWS_STATE_RETENTION_DAYS: ${{ vars.GOOGLE_NEWS_STATE_RETENTION_DAYS || '30' }}
          GOOGLE_NEWS_RUN_BUDGET_SECONDS: ${{ vars.GOOGLE_NEWS_RUN_BUDGET_SECONDS || '1080' }}
          FEED_DATE_FILTER: ${{ vars.FEED_DATE_FILTER }}
          FEED_KEYWORD_FILTER: ${{ vars.FEED_KEYWORD_FILTER }}
          FEED_KEYWORD_SCOPE: ${{ vars.FEED_KEYWORD_SCOPE || 'title' }}
          FEED_TIMEZONE: ${{ vars.FEED_TIMEZONE }}
          FEED_COUNTRY: ${{ vars.FEED_COUNTRY }}
          DISPLAY_LANGUAGE: ${{ vars.DISPLAY_LANGUAGE }}
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
          DISCORD_WEBHOOK_GN_TOP_US: ${{ secrets.DISCORD_WEBHOOK_GN_TOP_US }}
          DISCORD_WEBHOOK_GN_TOP_KR: ${{ secrets.DISCORD_WEBHOOK_GN_TOP_KR }}
          DISCORD_WEBHOOK_GN_TOP_JP: ${{ secrets.DISCORD_WEBHOOK_GN_TOP_JP }}
          DISCORD_WEBHOOK_GN_TOP_CN: ${{ secrets.DISCORD_WEBHOOK_GN_TOP_CN }}
          DISCORD_WEBHOOK_GN_TOPIC_KOREA: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_KOREA }}
          DISCORD_WEBHOOK_GN_TOPIC_SEOUL: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_SEOUL }}
          DISCORD_WEBHOOK_GN_TOPIC_ENT: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_ENT }}
          DISCORD_WEBHOOK_GN_TOPIC_TECH: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_TECH }}
          DISCORD_WEBHOOK_GN_TOPIC_SCITECH: ${{ secrets.DISCORD_WEBHOOK_GN_TOPIC_SCITECH }}
          DISCORD_WEBHOOK_GN_KEYWORD_NOCODE: ${{ secrets.DISCORD_WEBHOOK_GN_KEYWORD_NOCODE }}
          DISCORD_WEBHOOK_GN_KEYWORD_IU: ${{ secrets.DISCORD_WEBHOOK_GN_KEYWORD_IU }}
        shell: bash
        run: |
          profile_args=()
          if [[ "$SELECTED_PROFILE" != "all" ]]; then
            profile_args=(--profile-id "$SELECTED_PROFILE")
          fi
          python .github/scripts/google_news_dispatcher.py \
            --state-dir .google-news-state \
            --manual-test \
            "${profile_args[@]}"

      - name: Write safe run summary
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = '.google-news-state/run-summary.json';
            if (!fs.existsSync(path)) {
              await core.summary.addHeading('Google News').addRaw('No run summary was produced.').write();
              return;
            }
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const summaryRunId = summary.run_id ? String(summary.run_id) : '';
            if (summaryRunId && summaryRunId !== String(context.runId)) {
              await core.summary.addHeading('Google News').addRaw('No run summary was produced for this run.').write();
              return;
            }
            const processed = summary.profiles.reduce((total, item) => total + item.processed_count, 0);
            const pending = summary.profiles.reduce((total, item) => total + item.pending_count, 0);
            const ambiguous = summary.profiles.reduce((total, item) => total + item.ambiguous_retry_count, 0);
            const failedProfiles = summary.profiles.filter(item => item.status === 'failed');
            const skippedProfiles = summary.profiles.filter(item => item.status === 'skipped');
            const prunedItems = summary.retention?.items ?? 0;
            const budgetSkipped = summary.profiles.filter(item => item.error_code === 'time_budget_exhausted');
            const backlogProfiles = summary.profiles.filter(item => item.pending_count >= 100);
            core.summary
              .addHeading('Google News Manual Delivery Test')
              .addRaw(`Status: ${summary.status}\n`)
              .addRaw(`Profiles: ${summary.profiles.length}\n`)
              .addRaw(`Processed articles: ${processed}\n`)
              .addRaw(`Pending deliveries: ${pending}\n`)
              .addRaw(`Ambiguous retries: ${ambiguous}\n`)
              .addRaw(`Unmapped publishers: ${summary.unmapped_publisher_count ?? 0}\n`)
              .addRaw(`New unmapped publishers: ${summary.new_unmapped_publisher_count ?? 0}\n`)
              .addRaw(`Pruned state rows: ${prunedItems}\n`);
            if (summary.error_code) {
              core.summary.addRaw(`Error code: ${summary.error_code}\n`);
            }
            if (budgetSkipped.length > 0) {
              core.summary.addRaw(`Time budget reached for: ${budgetSkipped.map(item => item.profile_id).join(', ')}\n`);
            }
            if (summary.circuit_blocked_until) {

              core.summary.addRaw(`Google News paused until: ${summary.circuit_blocked_until}\n`);
            }
            if (failedProfiles.length > 0) {
              core.summary
                .addHeading('Failed profiles', 2)
                .addTable([
                  [
                    { data: 'Profile', header: true },
                    { data: 'Error code', header: true },
                    { data: 'Pending', header: true },
                  ],
                  ...failedProfiles.map(item => [
                    item.profile_id,
                    item.error_code ?? 'unknown_failure',
                    String(item.pending_count),
                  ]),
                ]);
            }
            if (skippedProfiles.length > 0) {
              core.summary
                .addHeading('Skipped profiles', 2)
                .addTable([
                  [
                    { data: 'Profile', header: true },
                    { data: 'Reason', header: true },
                  ],
                  ...skippedProfiles.map(item => [
                    item.profile_id,
                    item.error_code ?? 'circuit_open',
                  ]),
                ]);
            }
            if (backlogProfiles.length > 0) {
              core.summary
                .addHeading('Backlog', 2)
                .addTable([
                  [
                    { data: 'Profile', header: true },
                    { data: 'Pending', header: true },
                  ],
                  ...backlogProfiles.map(item => [
                    item.profile_id,
                    String(item.pending_count),
                  ]),
                ]);
            }
            await core.summary.write();

      - name: Upload updated state
        id: upload_state
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: google-news-state
          path: .google-news-state/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          overwrite: true

      - name: Retry state upload
        id: retry_state
        if: always() && steps.upload_state.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: google-news-state
          path: .google-news-state/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          overwrite: true

      - name: Note recovered state upload
        if: always() && steps.upload_state.outcome == 'failure' && steps.retry_state.outcome == 'success'
        run: echo "::warning title=Google News state upload retried::The first upload failed and the retry succeeded"

      - name: Fail when state upload failed
        if: always() && steps.upload_state.outcome == 'failure' && steps.retry_state.outcome == 'failure'
        run: |
          echo "::error title=Google News state upload failed::The next run may restore an older state and resend items."
          exit 1

      - name: Upload unmapped publisher review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-news-unmapped-publishers
          path: .google-news-state/unmapped-google-news-publishers.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Notify admin of failed run
        if: failure()
        env:
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os

          import requests

          webhook = os.environ.get("DISCORD_WEBHOOK_ADMIN", "").strip()
          run_url = os.environ.get("RUN_URL", "")
          if not webhook:
              print("DISCORD_WEBHOOK_ADMIN is not configured")
              raise SystemExit(0)

          lines = ["**Google News 실행 실패**", run_url]
          try:
              with open(".google-news-state/run-summary.json", encoding="utf-8") as handle:
                  summary = json.load(handle)
          except (OSError, ValueError):
              summary = {}
          if summary.get("error_code"):
              lines.append("error: {}".format(summary["error_code"]))
          failed = [
              profile
              for profile in summary.get("profiles", [])
              if profile.get("status") == "failed"
          ]
          if failed:
              lines.append(
                  "failed profiles: "
                  + ", ".join(
                      "{} ({})".format(
                          profile.get("profile_id"),
                          profile.get("error_code") or "unknown",
                      )
                      for profile in failed[:10]
                  )
              )
          try:
              response = requests.post(
                  webhook,
                  json={"content": "\n".join(lines), "username": "Discord Actions"},
                  timeout=(5.0, 15.0),
              )
              response.raise_for_status()
          except Exception as error:
              print("admin notification failed: {}".format(type(error).__name__))
          PY
