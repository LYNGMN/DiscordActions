version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    groups:
      python-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      python-minor-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
